name: daily-video
# Moi ngay tao 2 video slideshow tu 3 anh branded (nhac free tuy chon) -> dang Page.
# KHONG dung video/nhac ban quyen cua nguoi khac.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai ffmpeg + jq
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Tai 3 anh branded
        run: |
          curl -sL https://mushoplaho.kientlt59.workers.dev/og.png  -o 1.png
          curl -sL https://mushoplaho.kientlt59.workers.dev/og2.png -o 2.png
          curl -sL https://mushoplaho.kientlt59.workers.dev/og3.png -o 3.png

      - name: Nhac nen (file assets/music.mp3 hoac Jamendo neu co key)
        env:
          JAM: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          if [ -f assets/music.mp3 ]; then
            cp assets/music.mp3 music.mp3
          elif [ -n "$JAM" ]; then
            URL=$(curl -s "https://api.jamendo.com/v3.0/tracks/?client_id=$JAM&format=json&limit=1&order=popularity_total&vocalinstrumental=instrumental&include=musicinfo" | jq -r '.results[0].audiodownload')
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then curl -sL "$URL" -o music.mp3; fi
          fi
          if [ -f music.mp3 ]; then echo "co nhac"; else echo "khong nhac"; fi

      - name: Ghep 2 video (khac thu tu anh)
        run: |
          F="[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p[a];[1:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p[b];[2:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p[c];[a][b]xfade=transition=fade:duration=1:offset=4[ab];[ab][c]xfade=transition=fade:duration=1:offset=8[v]"
          ffmpeg -y -loop 1 -t 5 -i 1.png -loop 1 -t 5 -i 2.png -loop 1 -t 5 -i 3.png -filter_complex "$F" -map "[v]" -c:v libx264 -pix_fmt yuv420p -movflags +faststart v1.mp4
          ffmpeg -y -loop 1 -t 5 -i 3.png -loop 1 -t 5 -i 1.png -loop 1 -t 5 -i 2.png -filter_complex "$F" -map "[v]" -c:v libx264 -pix_fmt yuv420p -movflags +faststart v2.mp4
          for f in v1 v2; do
            if [ -f music.mp3 ]; then ffmpeg -y -i $f.mp4 -i music.mp3 -c:v copy -c:a aac -shortest ${f}_final.mp4; else cp $f.mp4 ${f}_final.mp4; fi
          done
          ls -la *_final.mp4

      - name: Dang 2 video len Page
        env:
          TOKEN: ${{ secrets.FB_PAGE_POST_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Chua co secret FB_PAGE_POST_TOKEN"; exit 1; fi
          D1="🔥 Mua Shopee được HOÀN LẠI tiền! Dán link sản phẩm vào mushoplaho.kientlt59.workers.dev để nhận link hoàn 50% hoa hồng. Miễn phí, không cài app 💸"
          D2="🛒 Bí quyết mua sắm thông minh: hoàn lại 50% hoa hồng mỗi đơn Shopee tại mushoplaho.kientlt59.workers.dev 💸"
          post() {
            R=$(curl -s -F "source=@$1" -F "description=$2" -F "access_token=$TOKEN" "https://graph.facebook.com/v19.0/1240334605834446/videos")
            echo "$R"; echo "$R" | grep -q '"id"' && echo "OK $1" || (echo "FAIL $1"; exit 1)
          }
          post v1_final.mp4 "$D1"
          post v2_final.mp4 "$D2"
