name: daily-reels
# Reel DOC "giat": B-roll shopping that (Pexels <=720p) cat nhanh + nhac Suno + intro/outro branded.
# Bo zoompan tren B-roll (footage da dong) -> build nhanh. Royalty-free.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cai ffmpeg + jq
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Tai anh branded
        run: |
          curl -sL https://mushoplaho.kientlt59.workers.dev/og.png  -o brand1.png
          curl -sL https://mushoplaho.kientlt59.workers.dev/og2.png -o brand2.png

      - name: Chon nhac Suno theo ngay
        run: |
          D=$(( $(date +%j) % 3 ))
          if [ $D -eq 0 ]; then cp assets/music.mp3 m.mp3; elif [ $D -eq 1 ]; then cp assets/music2.mp3 m.mp3; else cp assets/music3.mp3 m.mp3; fi

      - name: Tai B-roll Pexels (<=720p cho nhe)
        env:
          PK: ${{ secrets.PEXELS_API_KEY }}
        run: |
          # Nguoi THAT + NANG DONG (nhay, reaction, hao hung) thay vi canh tinh -> "co suc song, giat"
          # Xoay theo ngay de moi hom clip khac nhau (tranh trung lap)
          POOL=( "woman%20dancing" "happy%20people%20celebrating" "excited%20woman%20phone" "friends%20laughing" "young%20people%20fun" "girl%20dancing%20phone" "people%20party%20dance" "unboxing%20reaction" "online%20shopping" "happy%20woman%20shopping" "surprised%20face" "dancing%20street" )
          OFF=$(( $(date +%j) % ${#POOL[@]} ))
          i=0
          for k in 0 1 2 3 4 5; do
            Q=${POOL[$(( (OFF + k) % ${#POOL[@]} ))]}
            i=$((i+1))
            # lay tối đa 3 video/query roi random 1 cai -> da dang hon
            PAGE_PICK=$(( ( $(date +%j) + k ) % 3 + 1 ))
            URL=$(curl -s -H "Authorization: $PK" "https://api.pexels.com/videos/search?query=$Q&per_page=3&orientation=portrait&size=medium" | jq -r "([.videos[]?.video_files[]?|select(.height!=null and .height<=720 and .height>=400)]|sort_by(.height)|last|.link) // ([.videos[]?.video_files[]?|select(.height!=null)]|sort_by(.height)|.[0].link) // empty")
            if [ -n "$URL" ]; then curl -sL "$URL" -o broll$i.mp4 && echo "clip $i ($Q) OK ($(du -h broll$i.mp4|cut -f1))"; else echo "clip $i ($Q) fail"; fi
          done

      - name: Ghep reel giat (cat nhanh, ultrafast)
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 m.mp3); DUR=${DUR%.*}
          [ -z "$DUR" ] && DUR=18; [ "$DUR" -gt 22 ] && DUR=22
          echo "nhac ${DUR}s"
          fr() { python3 -c "print(int($1*30))"; }
          seg_brand() { ffmpeg -y -loop 1 -t $2 -i "$1" -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=22:3[bg];[0:v]scale=1000:-1[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2,zoompan=z='min(zoom+0.003,1.06)':d=$(fr $2):s=1080x1920:fps=30,setsar=1,format=yuv420p[v]" -map "[v]" -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p "$3"; }
          seg_vid() { ST=$(( RANDOM % 3 )); ffmpeg -y -ss $ST -t $2 -i "$1" -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setsar=1,format=yuv420p" -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p "$3"; }
          # Gom TAT CA clip co the dung: AI-nguoi-that (assets/aiclips) UU TIEN + Pexels broll
          CLIPS=(); if [ -d assets/aiclips ]; then for f in assets/aiclips/*.mp4; do [ -f "$f" ] && CLIPS+=("$f"); done; fi
          for f in broll1.mp4 broll2.mp4 broll3.mp4 broll4.mp4 broll5.mp4 broll6.mp4; do [ -f "$f" ] && CLIPS+=("$f"); done
          echo "tong clip dung duoc: ${#CLIPS[@]} (AI-nguoi uu tien)"
          rm -f list.txt
          seg_brand brand1.png 1.3 s_intro.mp4; echo "file 's_intro.mp4'" >> list.txt
          CUT=0.8; N=$(python3 -c "print(max(8,int(($DUR-3.0)/$CUT)))")
          for j in $(seq 1 $N); do
            if [ ${#CLIPS[@]} -gt 0 ]; then
              SRC=${CLIPS[$(( (j-1) % ${#CLIPS[@]} ))]}; seg_vid "$SRC" $CUT s_$j.mp4
            else seg_brand brand$(( (j%2)+1 )).png $CUT s_$j.mp4; fi
            echo "file 's_$j.mp4'" >> list.txt
          done
          seg_brand brand2.png 1.6 s_outro.mp4; echo "file 's_outro.mp4'" >> list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy silent.mp4
          ffmpeg -y -i silent.mp4 -i m.mp3 -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest reel.mp4
          echo "reel: $(du -h reel.mp4|cut -f1), $(ffprobe -v error -show_entries format=duration -of csv=p=0 reel.mp4)s"

      - name: Dang REELS (3 buoc)
        env:
          TOKEN: ${{ secrets.FB_PAGE_POST_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Chua co token"; exit 1; fi
          PAGE=1240334605834446
          DESC="🔥 Mua Shopee HOÀN LẠI 50% hoa hồng! Dán link vào mushoplaho.kientlt59.workers.dev — miễn phí, không cài app 💸 #hoantien #shopee #sansale #muasam"
          S=$(curl -s -X POST "https://graph.facebook.com/v19.0/$PAGE/video_reels" -d "upload_phase=start" -d "access_token=$TOKEN")
          echo "start: $S"; VID=$(echo "$S" | jq -r '.video_id'); UP=$(echo "$S" | jq -r '.upload_url')
          if [ -z "$VID" ] || [ "$VID" = "null" ]; then echo "start fail"; exit 1; fi
          SZ=$(stat -c%s reel.mp4)
          echo "upload: $(curl -s -X POST "$UP" -H "Authorization: OAuth $TOKEN" -H "offset: 0" -H "file_size: $SZ" --data-binary "@reel.mp4")"
          sleep 6
          F=$(curl -s -X POST "https://graph.facebook.com/v19.0/$PAGE/video_reels" -d "upload_phase=finish" -d "video_id=$VID" -d "video_state=PUBLISHED" --data-urlencode "description=$DESC" -d "access_token=$TOKEN")
          echo "finish: $F"; if echo "$F" | grep -q '"success":true'; then echo "OK REEL id=$VID"; else echo "FAIL"; exit 1; fi
