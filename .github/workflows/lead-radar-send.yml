name: lead-radar-send
# 01:00 gio VN moi ngay: quet lead moi -> gui theo CAP warm-up (25 -> ... -> 290) -> sync 'da xem' -> tang cap.
# Tuan tu, phan du giu lai hom sau. Brevo free = 300/ngay.
on:
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC = 01:00 gio VN
  workflow_dispatch:
    inputs:
      limit:
        description: 'Ep so mail lan nay (bo trong = dung CAP warm-up)'
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ secrets.LR_BASE }}
      TOKEN: ${{ secrets.LR_TOKEN }}
    steps:
      - name: Quet lead moi
        run: |
          echo "pull: $(curl -s -X POST "$BASE/pull?t=$TOKEN")"

      - name: Tu dong bo sung khi pool sap can (<250 lead chua gui)
        run: |
          for i in 1 2 3; do
            R=$(curl -s -X POST "$BASE/autofill?t=$TOKEN&threshold=250")
            echo "autofill#$i: $R"
            echo "$R" | grep -q '"action":"skip"' && break
            sleep 2
          done

      - name: Gui batch theo CAP warm-up
        run: |
          FORCE="${{ github.event.inputs.limit }}"
          if [ -n "$FORCE" ]; then CAP="$FORCE"; else CAP=$(curl -s "$BASE/cap?t=$TOKEN" | jq -r '.cap'); fi
          echo "CAP hom nay: $CAP"
          IDS=$(curl -s "$BASE/pending?t=$TOKEN&limit=$CAP" | jq -r '.ids[]?')
          N=$(echo "$IDS" | grep -c . || true)
          echo "Se gui: $N lead"
          SENT=0; FAIL=0
          for id in $IDS; do
            R=$(curl -s -X POST "$BASE/send?t=$TOKEN" -H 'content-type: application/json' -d "{\"id\":$id}")
            if echo "$R" | grep -q '"ok":true'; then SENT=$((SENT+1)); else FAIL=$((FAIL+1)); echo "  fail id=$id: $(echo $R|cut -c1-100)"; fi
            sleep 1.2
          done
          echo "==> DA GUI=$SENT | LOI=$FAIL"
          echo "SENT=$SENT" >> $GITHUB_ENV

      - name: Follow-up (nhac lead >5 ngay chua tra loi, trong ngan sach con lai)
        run: |
          REMAIN=$((290 - ${SENT:-0}))
          if [ "$REMAIN" -le 0 ]; then echo "het ngan sach, bo qua follow-up"; exit 0; fi
          IDS=$(curl -s "$BASE/pending-followup?t=$TOKEN&limit=$REMAIN&days=5" | jq -r '.ids[]?')
          N=$(echo "$IDS" | grep -c . || true)
          echo "Follow-up: $N lead (ngan sach con $REMAIN)"
          FU=0
          for id in $IDS; do
            R=$(curl -s -X POST "$BASE/send-followup?t=$TOKEN" -H 'content-type: application/json' -d "{\"id\":$id}")
            echo "$R" | grep -q '"ok":true' && FU=$((FU+1))
            sleep 1.2
          done
          echo "==> DA FOLLOW-UP=$FU"

      - name: Sync 'da xem'
        run: |
          echo "opens: $(curl -s -X POST "$BASE/sync-opens?t=$TOKEN")"

      - name: Sync email hong/spam (bao ve reputation)
        run: |
          echo "bounces: $(curl -s -X POST "$BASE/sync-bounces?t=$TOKEN")"

      - name: Tang CAP cho ngay mai
        if: ${{ github.event.inputs.limit == '' && env.SENT != '0' }}
        run: |
          echo "bump: $(curl -s -X POST "$BASE/cap-bump?t=$TOKEN")"
