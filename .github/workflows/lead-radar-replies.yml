name: lead-radar-replies
# Quet Gmail INBOX (IMAP) tim reply tu lead da gui -> danh dau 'da tra loi' tren dashboard.
on:
  schedule:
    - cron: '*/15 * * * *'   # moi 15 phut -> reply hien gan realtime (khong doi 2h)
  workflow_dispatch: {}

jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i imapflow@1 mailparser@3
      - name: Quet reply
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          LR_BASE: ${{ secrets.LR_BASE }}
          LR_TOKEN: ${{ secrets.LR_TOKEN }}
        run: node scripts/lead-radar-replies.mjs
      - name: Ghi nhan thu MINH da tra loi (hop Sent)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          LR_BASE: ${{ secrets.LR_BASE }}
          LR_TOKEN: ${{ secrets.LR_TOKEN }}
        run: node scripts/lead-radar-sent.mjs
      - name: Canh bao email khi co lead QUAN TAM / lead chua xu ly
        run: |
          echo "alerts: $(curl -s -X POST "${{ secrets.LR_BASE }}/alerts?t=${{ secrets.LR_TOKEN }}")"
